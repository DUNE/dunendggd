# This workflow uploads the default geometry to an existing release.
# Create the release manually on GitHub before pushing the tag.

name: Upload geometries to release

permissions:
  contents: write

on:
  push:
    tags:
    - "v*.*.*"
    - "*_v_*.*.*"

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # We need the full history for the git metadata
    - name: Setup
      run: pip install .
    - name: Build default gdml files
      run: make -j $(nproc)
    - name: Rename gdml files to include tag
      run: |
        for F in *.gdml
        do
          mv $F ${F%.gdml}_${GITHUB_REF_NAME}.gdml
        done
    - name: Compress geometry files
      run: tar -czf default_geometries_${GITHUB_REF_NAME}.tar.gz *.gdml
    - name: Install ROOT
      run: sudo snap install root-framework
    - name: Convert gdml files to root
      run: |
        for F in *.gdml
        do
          root "gdml2root.C(\"$F\", \"${F%.gdml}.root\")"
        done
    - name: Upload files to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${GITHUB_REF_NAME} default_geometries_*.tar.gz *.root

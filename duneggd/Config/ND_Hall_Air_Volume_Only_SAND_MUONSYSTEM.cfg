[ND_Hall_Air_Volume]

class = duneggd.Hall.ND_Hall_Air_Volume.NDHallAirVolumeBuilder

# Muon system: the external scintillator planes are daughters of
# volMuonSystem (MUON_SYSTEM.cfg), a union of one air box per plane, so no
# single box encloses volSAND.
# The i-th subbuilder takes the i-th row of Positions and Rotations: keep the
# rows aligned in this order.
subbuilders = ['SAND', 'MuonSystem']

Positions = [ [Q('18484mm'), Q('-3.39m'), Q('14.31m')],   #SAND
              [Q('18484mm'), Q('-3.2225m'), Q('9110mm')]  #MuonSystem: origin = centre of TaggerFar -> global z 18710
            ]

# MuonSystem row: IDENTITY rotation, not -90deg.  SAND is rotated by -90deg
# about y because its solenoid axis is transverse to the beam; the hall is
# not rotated with respect to the world (only shifted by +9600 mm in z), so
# with the identity the local z axis of volMuonSystem is the BEAM axis, along
# which the builder lays out the planes.
Rotations = [ [Q('0deg'), Q('-90deg'), Q('0deg')],  #SAND
              [Q('0deg'), Q('0deg'), Q('0deg')]     #MuonSystem: IDENTITY
            ]

mat = 'Air'


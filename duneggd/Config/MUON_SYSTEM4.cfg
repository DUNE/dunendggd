# =============================================================================
#  TAGGER4: gli stessi quattro piani di TAGGER3, raccolti nel volume madre
#  volMuonSystem (figlio di volDetEnclosure) invece di essere figli diretti
#  della caverna.  Posizioni globali, dimensioni, materiale, nomi e SensDet
#  dei piani identici a TAGGER3; le sezioni dei piani sono copiate da
#  MUON_TAGGER3.cfg senza modifiche.
#
#  volMuonSystem = unione di quattro box d'aria, uno per piano, piu' grandi del
#  piano di `margin` per lato: semilati 4001 x 4218.5 x 3.5 mm contro
#  4000 x 4217.5 x 2.5 del piano.  Non una scatola unica: ingloberebbe volSAND
#  (vedi MuonSystemPlane.py).  Builder: duneggd/SubDetector/MuonSystem.py.
#
#  FRAME DI volMuonSystem: origine nel centro di TaggerFar.  La hall lo piazza
#  in (18484mm, -3.2225m, 9110mm) hall-local
#  (ND_Hall_Air_Volume_Only_SAND_TAGGER4.cfg).
#
#    piano         Positions z   z hall-local   z globale
#    TaggerFar          0 mm        9110 mm     18710 mm
#    TaggerNear      1500 mm       10610 mm     20210 mm
#    CatcherNear     8900 mm       18010 mm     27610 mm
#    CatcherFar     10400 mm       19510 mm     29110 mm
#
#  Tutti a x globale 0 e y hall-local -3222.5 mm (y globale [-643.5, 200] cm).
# =============================================================================

[MuonSystem]
class       = duneggd.SubDetector.MuonSystem.MuonSystemBuilder
subbuilders = ['TaggerFar', 'TaggerNear', 'CatcherNear', 'CatcherFar']
mat         = 'Air'
margin      = Q('1mm')
Positions   = [ [Q('0mm'), Q('0mm'), Q('0mm')],      #TaggerFar
                [Q('0mm'), Q('0mm'), Q('1500mm')],   #TaggerNear
                [Q('0mm'), Q('0mm'), Q('8900mm')],   #CatcherNear
                [Q('0mm'), Q('0mm'), Q('10400mm')] ] #CatcherFar

[TaggerFar]
class     = duneggd.SubDetector.MuonSystemPlane.MuonSystemPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('4217.5mm')
sensdet   = 'MuonSystem_TaggerFar'
mat       = 'Scintillator'

[TaggerNear]
class     = duneggd.SubDetector.MuonSystemPlane.MuonSystemPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('4217.5mm')
sensdet   = 'MuonSystem_TaggerNear'
mat       = 'Scintillator'

[CatcherNear]
class     = duneggd.SubDetector.MuonSystemPlane.MuonSystemPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('4217.5mm')
sensdet   = 'MuonSystem_CatcherNear'
mat       = 'Scintillator'

[CatcherFar]
class     = duneggd.SubDetector.MuonSystemPlane.MuonSystemPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('4217.5mm')
sensdet   = 'MuonSystem_CatcherFar'
mat       = 'Scintillator'
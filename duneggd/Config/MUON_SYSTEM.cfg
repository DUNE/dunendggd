# =============================================================================
#  Only_SAND_MuonSystem: due piani di scintillatore attorno a SAND, uno a
#  monte (TaggerFar) e uno a valle (CatcherFar), raccolti nel volume madre
#  volMuonSystem (figlio di volDetEnclosure).  Rispetto a TAGGER3/TAGGER4 sono
#  stati tolti i piani "near" (TaggerNear, CatcherNear); posizioni globali,
#  dimensioni (800 x 843.5 x 0.5 cm), materiale e nomi dei volumi dei due
#  piani rimasti sono invariati.
#
#  volMuonSystem = unione di due box d'aria, uno per piano, piu' grandi del
#  piano di `margin` per lato: semilati 4001 x 4218.5 x 3.5 mm contro
#  4000 x 4217.5 x 2.5 del piano.  Non una scatola unica: ingloberebbe volSAND
#  (vedi MuonSystem.py).  Builder: duneggd/SubDetector/MuonSystem.py (involucro)
#  e duneggd/SubDetector/MuonSystemPlane.py (piani).
#
#  FRAME DI volMuonSystem: origine nel centro di TaggerFar.  La hall lo piazza
#  in (18484mm, -3.2225m, 9110mm) hall-local
#  (ND_Hall_Air_Volume_Only_SAND_MUONSYSTEM.cfg).
#
#    piano         Positions z   z hall-local   z globale
#    TaggerFar          0 mm        9110 mm     18710 mm
#    CatcherFar     10400 mm       19510 mm     29110 mm
#
#  Tutti a x globale 0 e y hall-local -3222.5 mm (y globale [-643.5, 200] cm).
# =============================================================================

[MuonSystem]
class       = duneggd.SubDetector.MuonSystem.MuonSystemBuilder
subbuilders = ['TaggerFar', 'CatcherFar']
mat         = 'Air'
margin      = Q('1mm')
Positions   = [ [Q('0mm'), Q('0mm'), Q('0mm')],      #TaggerFar
                [Q('0mm'), Q('0mm'), Q('10400mm')] ] #CatcherFar

[TaggerFar]
class     = duneggd.SubDetector.MuonSystemPlane.MuonSystemPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('4217.5mm')
sensdet   = 'MuonSystem_TaggerFar'
mat       = 'Scintillator'

[CatcherFar]
class     = duneggd.SubDetector.MuonSystemPlane.MuonSystemPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('4217.5mm')
sensdet   = 'MuonSystem_CatcherFar'
mat       = 'Scintillator'

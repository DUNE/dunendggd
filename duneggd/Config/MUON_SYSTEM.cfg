# =============================================================================
#  SAND muon system: two scintillator planes, one upstream of SAND
#  (TaggerFar) and one downstream (CatcherFar), held by the mother volume
#  volMuonSystem (daughter of volDetEnclosure).  Each plane is
#  800 x 843.5 x 0.5 cm of scintillator.
#
#  volMuonSystem = union of one air box per plane, larger than the plane by
#  `margin` on every side: half-sizes 4001 x 4218.5 x 3.5 mm against
#  4000 x 4217.5 x 2.5 mm of the plane.  Not a single box, which would
#  enclose volSAND.  Builders: duneggd/SubDetector/MuonSystem.py (envelope)
#  and duneggd/SubDetector/MuonSystemPlane.py (planes).
#
#  The muon system does not depend on the SAND tracker: use it with
#  ND_Hall_Air_Volume_Only_SAND_MUONSYSTEM.cfg and any SAND configuration.
#
#  volMuonSystem FRAME: origin at the centre of TaggerFar.  The hall places it
#  at (18484mm, -3.2225m, 9110mm) hall-local
#  (ND_Hall_Air_Volume_Only_SAND_MUONSYSTEM.cfg).
#
#    plane         Positions z   z hall-local   z global
#    TaggerFar          0 mm        9110 mm     18710 mm
#    CatcherFar     10400 mm       19510 mm     29110 mm
#
#  Both at global x = 0 and hall-local y = -3222.5 mm (global y [-643.5, 200] cm).
#  Hall-local z = global z - 9600 mm.
# =============================================================================

[MuonSystem]
class       = duneggd.SubDetector.MuonSystem.MuonSystemBuilder
subbuilders = ['TaggerFar', 'CatcherFar']
mat         = 'Air'
margin      = Q('1mm')
Positions   = [ [Q('0mm'), Q('0mm'), Q('0mm')],      #TaggerFar
                [Q('0mm'), Q('0mm'), Q('10400mm')] ] #CatcherFar

[TaggerFar]
class     = duneggd.SubDetector.MuonSystemPlane.MuonSystemPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('4217.5mm')
sensdet   = 'MuonSystem_TaggerFar'
mat       = 'Scintillator'

[CatcherFar]
class     = duneggd.SubDetector.MuonSystemPlane.MuonSystemPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('4217.5mm')
sensdet   = 'MuonSystem_CatcherFar'
mat       = 'Scintillator'

# ===========================================================================
#  Piani esterni di scintillatore per il muon tagger / catcher di SAND.
#
#  UN PIANO PER SEZIONE: ogni sezione e' un builder indipendente, piazzato
#  dalla hall alla propria posizione.  Per spostare un piano si cambia la sua
#  riga in ND_Hall_Air_Volume_Only_SAND.cfg; per cambiarne spessore o
#  superficie si cambia qui.  Nessun volume contenitore, quindi nessuna
#  sovrapposizione con volSAND.
#
#  POSIZIONI (stabilite nella hall, riportate qui per riferimento)
#
#    piano         z globale   z hall-local   da volSAND   dal ferro
#    TaggerFar        18710         9110         1600 mm     1905 mm
#    TaggerNear       20210        10610          100 mm      405 mm
#    CatcherNear      27610        18010           95 mm      405 mm
#    CatcherFar       29110        19510         1595 mm     1905 mm
#
#    z_hall = z_globale - 9600 mm (il centro della hall nel frame globale).
#    Trasversalmente tutti a (18484mm, -3.39m) hall-local = (0, -2385mm)
#    globali, cioe' centrati sull'ASSE DEI CILINDRI di SAND, non su y = 0.
#
#  GEOMETRIA DI RIFERIMENTO (misurata per ray-tracing lungo il fascio)
#    20310         faccia monte di volSAND
#    20615..20985  giogo, 370 mm di ferro (parete RADIALE del barrel)
#    26840..27210  giogo, 370 mm
#    27515         faccia valle di volSAND
#    29575         parete della caverna  -> CatcherFar ha 465 mm di margine
#
#  SPESSORE 5 mm: un MIP deposita ~1.03 MeV, abbondantemente sopra soglia.
#  Sono l'1.2% di X0, quindi la perturbazione della traiettoria resta
#  trascurabile: si misura l'accettanza geometrica senza falsarla.
#  Massa per piano ~305 kg.
#
#  PER LO SCAN: aggiungere altre sezioni con le stesse impostazioni e la
#  propria riga nella hall.  I piani sono sottili e non si disturbano, quindi
#  se ne possono mettere molti in una sola geometria e ricostruire
#  l'accettanza in funzione della distanza da un unico campione.
# ===========================================================================

[TaggerFar]
class     = duneggd.SubDetector.MuonTaggerPlane.MuonTaggerPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('3600mm')
sensdet   = 'MuonTagger_TaggerFar'
mat       = 'Scintillator'

[TaggerNear]
class     = duneggd.SubDetector.MuonTaggerPlane.MuonTaggerPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('3600mm')
sensdet   = 'MuonTagger_TaggerNear'
mat       = 'Scintillator'

[CatcherNear]
class     = duneggd.SubDetector.MuonTaggerPlane.MuonTaggerPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('3600mm')
sensdet   = 'MuonTagger_CatcherNear'
mat       = 'Scintillator'

[CatcherFar]
class     = duneggd.SubDetector.MuonTaggerPlane.MuonTaggerPlaneBuilder
thickness = Q('5mm')
halfX     = Q('4000mm')
halfY     = Q('3600mm')
sensdet   = 'MuonTagger_CatcherFar'
mat       = 'Scintillator'